alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
kube-state-metrics:
  enabled: false
server:
  persistentVolume:
    enabled: false
  retention: 24h
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
extraScrapeConfigs: |
  - job_name: kube-state-metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["incident-to-pr-kube-state-metrics.online-boutique.svc.cluster.local:8080"]
